<head>
    <link rel="stylesheet" href="css/container.css">
    <link rel="stylesheet" href="css/buttons.css">
</head>
<body>
    <div class="container">
        <button type="button" onClick="exitConainer()" class="exit-button">x</button>
        <div class="content">
            <h1>Betting Game (SDL)</h1>
            <p>This is a simple game using C++ with SDL where the objective is for the player to bet points on the colour with the most amount of chips.</p>
            <div class="Buttons">
                <a href="projects\betting game (sdl)\Game(Win).zip" download style="text-decoration: none;">
                    <button type="button" class="button-cv">Download</button>
                </a>
                <button type="button" onclick="window.open('https://github.com/rafaeu9/Challenge_GameDev_MarioFernandes')" class="button-cv">Source Code</button>
            </div>
            <br>
            <img class="image" src="projects\betting game (sdl)\Screenshot 2022-01-31 231458.png" alt="Game picture" height="500" width="auto">
            <p>To play the game you use the Z key to add points, X key to remove points, C key to switch bets and Space key to start/pause the game.</p>
        </div>
    </div>
</body>
